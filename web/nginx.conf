server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA — /verify-email, /?token=..., /?device_ticket=... all resolve
    # client-side via query params, not real routes; every path must
    # still serve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
