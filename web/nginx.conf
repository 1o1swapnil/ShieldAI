server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # The dashboard has one-click, no-confirm destructive actions (revoke
    # device/session/install-token) and bearer-token auth gives no CSRF
    # token to lean on — refusing to be framed closes the UI-redressing
    # angle (attacker iframes the app while an admin is logged in, overlays
    # decoy UI on the real "Revoke" button).
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    # Dedicated path so a healthcheck confirms nginx is serving, not just that
    # the process is running — distinct from "/" which always 200s via the
    # SPA fallback below even if the build is broken.
    location = /health {
        default_type text/plain;
        return 200 "ok";
    }

    # SPA — /verify-email, /?token=..., /?device_ticket=... all resolve
    # client-side via query params, not real routes; every path must
    # still serve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
