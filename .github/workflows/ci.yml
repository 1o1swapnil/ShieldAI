name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  server-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm test
        working-directory: server

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web

  integration-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: shieldai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:test@localhost:5432/shieldai
      APP_DATABASE_URL: postgres://postgres:test@localhost:5432/shieldai
      JWT_SECRET: ci-integration-test-secret
      WEB_ORIGIN: http://localhost:5173
      PORT: 3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: node scripts/migrate.js
        working-directory: server
      - name: Start server
        run: nohup node src/index.js > /tmp/server.log 2>&1 &
        working-directory: server
      - run: node scripts/smoke-test.js
        working-directory: server
        env:
          API_BASE: http://localhost:3000
          SERVER_LOG_FILE: /tmp/server.log
      - name: Server log
        if: always()
        run: cat /tmp/server.log

  extension-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate extension JSON files
        run: |
          for f in extension/manifest.json extension/rules.json extension/build-info.json extension/config.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f', 'utf8'))" && echo "OK: $f"
          done
      - name: Check rules.json / manifest.json match the tool library
        run: node generate-rules.js --check
        working-directory: extension

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build ./server -t shieldai-server
      - run: docker build ./web -t shieldai-web
